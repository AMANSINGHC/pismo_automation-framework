# Target environment configuration.
#
# Precedence:
#   CLI arguments > environment variables > this file.
#
# Environment variables:
#   PISMO_ENV       -> environments.<name>
#   PISMO_BASE_URL  -> environments.<name>.base_url
#   PISMO_TIMEOUT_S -> timeout_s
#
# CLI overrides:
#   pytest --env staging --base-url URL

environment: prism

# Shared defaults. Environment-specific values override these.
defaults:
  timeout_s: 10

environments:
  # Contract-driven Prism mock.
  #
  # Start with:
  #   prism mock -p 8080 contract/transactions-service.v1.yaml
  prism:
    base_url: http://localhost:8080

  # Real/shared environment.
  # Configure via PISMO_BASE_URL or --base-url when available.
  staging:
    base_url: ""