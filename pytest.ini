[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
pythonpath = .

# Always generate CI-friendly reports. Command-line options can override these.
addopts = -ra --strict-markers --strict-config
    --junit-xml=reports/junit.xml
    --html=reports/report.html --self-contained-html
    
# Parallel runs are optional: use `-n` from the command line or CI.
# Default runs stay single-process; pytest-xdist is required.
# These settings also pin the XML suite name and schema for CI.
junit_suite_name = pismo
junit_family = xunit2

markers =
    accounts: tests for the Accounts service
    transactions: tests for the Transactions service

    smoke: fast deterministic tests executed on every PR
    negative: rejection scenarios for invalid input
    idempotency: duplicate-submission scenarios

    e2e: end-to-end journeys across services

    mock_compatible: tests whose expectations the mock replay satisfies

    pre_release: tests included in the prerelease validation suite
    nightly: tests included in the nightly validation suite
