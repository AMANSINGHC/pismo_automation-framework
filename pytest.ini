[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
pythonpath = .
# Every run writes the same two report files, so there is never a flag to remember:
# --junit-xml is pytest core, --html comes from pytest-html. The paths are relative
# to the working directory the run is started from, and an explicit --junit-xml /
# --html on the command line overwrites them. --strict-config turns a typo in any key
# in this file into an error rather than a warning.
addopts = -ra --strict-markers --strict-config
    --junit-xml=reports/junit.xml
    --html=reports/report.html --self-contained-html
# Parallel execution is deliberately not in addopts: `-n` stays a command-line
# choice (`make test-parallel`, `python -m pytest -n4`), so a default run keeps its
# single-process order and API-call count, while a CI job can still turn it on with
# PYTEST_ADDOPTS without editing this file. Needs pytest-xdist (requirements.txt).
# These two shape that XML: the suite name a CI listing shows, and the schema CI
# servers validate, pinned rather than left to whatever pytest defaults to.
junit_suite_name = pismo
junit_family = xunit2
markers =
    accounts: tests for the Accounts service
    transactions: tests for the Transactions service
    smoke: critical happy path tests
